[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-trace"
version = "0.1.0"
description = "Monocular video to MMD VMD motion (MVP)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenCode" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "mediapipe>=0.10.8",
  "pypmxvmd>=2.7.1",
  "pyyaml>=6.0.1",
  "scipy>=1.15.3",
  "pydantic>=2.12.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mmd-trace = "mmd_trace.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
